<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pink Envelope Letter</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="scene">
      <button class="envelope" id="envelope" aria-label="Open the letter">
        <div class="flap"></div>
        <div class="body">
          <div class="letter">
            <div class="letter-content">
              <p>
                Hello my Madam Ainne I know I've done things that upset your emotions and feelings but don't doubt for a second that I'm playing your emotions, never wished to and never will do that to you, I want to be by your side at anything that will happen. I want you to lean on my shoulder when things get tough and i'm always here when you need me and my affection will never change towards you no matter what
                <br /><br />
                I'm sorry that you feel I'm talking to another woman behind your back, I know it looks like that but I can prove to you na that wasn't the case at all you don't have to worry about any woman aas a kompetensya because no woman will amount to you for me, hindi po ako yung nag uunang chat or nag cha chat to the ones chatting me and lahat po yon is either nag aask ng help about something but other than that there is no such thing as flirting or landi, I'M SOO SOO SOORRRRY MADAMMMMMM
              </p>
            </div>
          </div>
        </div>
      </button>
    </main>

    <script src="index.js"></script>
  </body>
</html>
